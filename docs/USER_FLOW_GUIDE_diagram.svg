<svg viewBox="0 0 820 1080" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
    <marker id="arrowGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#9ca3af"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="820" height="1080" fill="#ffffff"/>

  <!-- Title -->
  <text x="410" y="34" text-anchor="middle" font-size="22" font-weight="700" fill="#111827">CDAT User Flow</text>

  <!-- Main spine boxes -->
  <!-- 1 Sign in -->
  <rect x="260" y="55" width="300" height="60" rx="10" fill="#e0e7ff" stroke="#4f46e5" stroke-width="1.5"/>
  <text x="410" y="80" text-anchor="middle" font-size="15" font-weight="600" fill="#312e81">1. Sign In</text>
  <text x="410" y="99" text-anchor="middle" font-size="12" fill="#4338ca">username + password</text>

  <line x1="410" y1="115" x2="410" y2="145" stroke="#374151" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 2 Dashboard -->
  <rect x="260" y="147" width="300" height="60" rx="10" fill="#e0e7ff" stroke="#4f46e5" stroke-width="1.5"/>
  <text x="410" y="172" text-anchor="middle" font-size="15" font-weight="600" fill="#312e81">2. Dashboard</text>
  <text x="410" y="191" text-anchor="middle" font-size="12" fill="#4338ca">Quick Links + notices</text>

  <line x1="410" y1="207" x2="410" y2="237" stroke="#374151" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 3 Sidebar menu -->
  <rect x="260" y="239" width="300" height="60" rx="10" fill="#e0e7ff" stroke="#4f46e5" stroke-width="1.5"/>
  <text x="410" y="264" text-anchor="middle" font-size="15" font-weight="600" fill="#312e81">3. Sidebar Menu</text>
  <text x="410" y="283" text-anchor="middle" font-size="12" fill="#4338ca">pick a module group</text>

  <line x1="410" y1="299" x2="410" y2="329" stroke="#374151" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 4 Pick screen -->
  <rect x="260" y="331" width="300" height="60" rx="10" fill="#e0e7ff" stroke="#4f46e5" stroke-width="1.5"/>
  <text x="410" y="356" text-anchor="middle" font-size="15" font-weight="600" fill="#312e81">4. Pick a Search Screen</text>
  <text x="410" y="375" text-anchor="middle" font-size="12" fill="#4338ca">e.g. JRMS &#8594; Name Search</text>

  <line x1="410" y1="391" x2="410" y2="421" stroke="#374151" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 5 Fill + submit -->
  <rect x="260" y="423" width="300" height="60" rx="10" fill="#e0e7ff" stroke="#4f46e5" stroke-width="1.5"/>
  <text x="410" y="448" text-anchor="middle" font-size="15" font-weight="600" fill="#312e81">5. Fill Criteria &amp; Submit</text>
  <text x="410" y="467" text-anchor="middle" font-size="12" fill="#4338ca">form loads results in place</text>

  <line x1="410" y1="483" x2="410" y2="513" stroke="#374151" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 6 Results -->
  <rect x="260" y="515" width="300" height="60" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="410" y="540" text-anchor="middle" font-size="15" font-weight="700" fill="#1e3a8a">6. View Results</text>
  <text x="410" y="559" text-anchor="middle" font-size="12" fill="#1e40af">banner + table + photos</text>

  <!-- Branch lines from Results to 3 options -->
  <line x1="410" y1="575" x2="140" y2="625" stroke="#374151" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="410" y1="575" x2="410" y2="625" stroke="#374151" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="410" y1="575" x2="680" y2="625" stroke="#374151" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Branch A: Export / Print -->
  <rect x="10" y="627" width="260" height="64" rx="10" fill="#d1fae5" stroke="#059669" stroke-width="1.5"/>
  <text x="140" y="652" text-anchor="middle" font-size="14" font-weight="600" fill="#065f46">A. Export / Print</text>
  <text x="140" y="670" text-anchor="middle" font-size="11.5" fill="#047857">CSV download or browser print</text>
  <text x="140" y="686" text-anchor="middle" font-size="11.5" fill="#047857">(stays on this page)</text>

  <!-- Branch B: New search (loop) -->
  <rect x="280" y="627" width="260" height="64" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="410" y="652" text-anchor="middle" font-size="14" font-weight="600" fill="#92400e">B. Start a New Search</text>
  <text x="410" y="670" text-anchor="middle" font-size="11.5" fill="#b45309">clear form and search again</text>

  <!-- loop arrow from B back to step 5 -->
  <path d="M 280 655 C 190 655, 190 453, 258 453" fill="none" stroke="#d97706" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Branch C: Follow a link -->
  <rect x="550" y="627" width="260" height="64" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="680" y="652" text-anchor="middle" font-size="14" font-weight="600" fill="#991b1b">C. Follow a Record Link</text>
  <text x="680" y="670" text-anchor="middle" font-size="11.5" fill="#b91c1c">e.g. history, phone, IR match</text>
  <text x="680" y="686" text-anchor="middle" font-size="11.5" fill="#b91c1c">opens another page</text>

  <!-- loop arrow from C back to step 3 -->
  <path d="M 700 691 C 700 760, 600 780, 560 761" fill="none" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="700" y="740" text-anchor="middle" font-size="11" fill="#991b1b">lands on a new module/page</text>

  <!-- Logout box -->
  <line x1="410" y1="299" x2="260" y2="299" stroke="#6b7280" stroke-width="1.3" stroke-dasharray="4 3"/>
  <path d="M 260 299 C 150 299, 150 830, 260 850" fill="none" stroke="#6b7280" stroke-width="1.3" stroke-dasharray="4 3" marker-end="url(#arrowGray)"/>
  <rect x="260" y="852" width="300" height="60" rx="10" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/>
  <text x="410" y="877" text-anchor="middle" font-size="15" font-weight="600" fill="#374151">Logout</text>
  <text x="410" y="896" text-anchor="middle" font-size="12" fill="#6b7280">available any time, no confirmation</text>
  <text x="140" y="822" text-anchor="middle" font-size="11" fill="#6b7280">click any time from the sidebar</text>

  <!-- Idle timeout dashed path -->
  <line x1="560" y1="299" x2="700" y2="299" stroke="#9ca3af" stroke-width="1.3" stroke-dasharray="4 3"/>
  <path d="M 700 299 C 790 299, 790 60, 562 78" fill="none" stroke="#9ca3af" stroke-width="1.3" stroke-dasharray="4 3" marker-end="url(#arrowGray)"/>
  <rect x="600" y="330" width="200" height="56" rx="10" fill="#f9fafb" stroke="#9ca3af" stroke-width="1.3" stroke-dasharray="4 3"/>
  <text x="700" y="352" text-anchor="middle" font-size="12.5" font-weight="600" fill="#4b5563">Idle ~30 minutes</text>
  <text x="700" y="369" text-anchor="middle" font-size="11" fill="#6b7280">on any screen</text>
  <line x1="700" y1="330" x2="700" y2="299" stroke="#9ca3af" stroke-width="1.3" stroke-dasharray="4 3"/>
  <text x="700" y="270" text-anchor="middle" font-size="11" fill="#6b7280">session expires silently</text>
  <text x="700" y="410" text-anchor="middle" font-size="11" fill="#6b7280">sent back to Sign In</text>

  <!-- Legend -->
  <rect x="30" y="960" width="14" height="14" fill="#e0e7ff" stroke="#4f46e5"/>
  <text x="50" y="972" font-size="12" fill="#374151">Main flow</text>

  <rect x="150" y="960" width="14" height="14" fill="#d1fae5" stroke="#059669"/>
  <text x="170" y="972" font-size="12" fill="#374151">Export / print</text>

  <rect x="290" y="960" width="14" height="14" fill="#fef3c7" stroke="#d97706"/>
  <text x="310" y="972" font-size="12" fill="#374151">Repeat search</text>

  <rect x="430" y="960" width="14" height="14" fill="#fee2e2" stroke="#dc2626"/>
  <text x="450" y="972" font-size="12" fill="#374151">Follow a link</text>

  <rect x="30" y="990" width="14" height="14" fill="#f3f4f6" stroke="#6b7280"/>
  <text x="50" y="1002" font-size="12" fill="#374151">Logout</text>

  <line x1="150" y1="997" x2="164" y2="997" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="172" y="1002" font-size="12" fill="#374151">Dashed = automatic / always-available path</text>
</svg>
