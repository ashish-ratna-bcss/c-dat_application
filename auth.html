<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Login &ndash; Call Data Analysis Tool</title>
<link href="SpryAssets/sprymenubarhorizontal.css" rel="stylesheet" type="text/css" />
<link href="SpryAssets/sprymenubarvertical.css" rel="stylesheet" type="text/css" />
<style type="text/css">
body{
/* Real path on disk is IMAGES/analysis.jpg. The old "images/ANALYSIS.JPG"
   only resolved because NTFS ignores case; it would 404 on Linux. */
background-image: url(IMAGES/analysis.jpg);
background-size: cover;
}
.aa{
width: 300px;
/* min-height, not height: the box has to grow when the error message appears,
   otherwise the Login button spills out below the panel. */
min-height: 300px;
background-color: rgba(0,0,0,0.4);
margin:0 auto;
margin-top:40px;
padding-top:10px;
padding-bottom:20px;
padding-left: 50px;
border-radius: 15px;
-webkit-border-radius: 15px;
-moz-border-radius:15px;
color:white;
font-weight:bolder;
box-shadow: inset -4px -4px rgba(0,0,0,0.4);
font-size:18px;
}
.aa input[type="text"],
.aa input[type="password"]{
width:200px;
height:35px;
border:0;
border-radius:5px;
-webkit-border-radius:5px;
-moz-border-radius:5px;
padding-left: 10px;
}
.aa input[type="submit"]{
width:200px;
height:35px;
border:0;
border-radius:5px;
-webkit-border-radius:5px;
-moz-border-radius:5px;
background-color: orange;
font-weight: bolder;
cursor: pointer;
}
.aa label{ display:block; margin-bottom:4px; }
.aa p{ margin:0 0 14px 0; }
.aa .msg{
width:200px;
padding:6px 10px;
background-color: rgba(146,18,21,0.9);
border-radius:5px;
font-size:14px;
line-height:1.3;
}
.aa input[type="submit"][disabled]{
background-color:#b9852f;
cursor: progress;
}
</style>
</head>
<body>
<marquee><h1>Hydrabad Police Department</h1></marquee>
<div class="aa">
<h2>Login</h2>
<!-- action is the real filename, not LOGIN1.PHP: the .PHP spelling only
     resolves through the case-fallback rewrite in .htaccess. -->
<form action="login1.php" method="post" id="loginForm">
<p class="msg" id="loginMsg" role="alert" aria-live="polite" hidden></p>
<p>
<label for="USERNAME">USERNAME:</label>
<input type="text" name="USERNAME" id="USERNAME" placeholder="Please Enter username...."
       autocomplete="username" required>
</p>
<p>
<label for="PASSWORD">PASSWORD:</label>
<input type="password" name="PASSWORD" id="PASSWORD" placeholder="Please Enter Password...."
       autocomplete="current-password" required>
</p>
<p><input type="submit" value="Login" id="loginBtn"></p>
</form>
</div>

<script>
// Check the password without leaving the page. Without JavaScript the form
// posts normally and login1.php answers with its plain HTML, so this is an
// enhancement, not a requirement.
(function () {
  var form = document.getElementById('loginForm');
  var msg  = document.getElementById('loginMsg');
  var btn  = document.getElementById('loginBtn');
  var pwd  = document.getElementById('PASSWORD');

  function fail(text) {
    msg.textContent = text;
    msg.hidden = false;
    btn.disabled = false;
    btn.value = 'Login';
    pwd.value = '';
    pwd.focus();
  }

  form.addEventListener('submit', function (e) {
    e.preventDefault();
    msg.hidden = true;
    btn.disabled = true;
    btn.value = 'Checking…';

    fetch(form.action, {
      method: 'POST',
      headers: {
        'X-Requested-With': 'XMLHttpRequest',
        'Accept': 'application/json'
      },
      body: new URLSearchParams(new FormData(form)),
      // The point of the request is the session cookie login1.php sets.
      credentials: 'same-origin'
    })
    .then(function (r) { return r.json(); })
    .then(function (data) {
      if (data && data.ok) {
        // Button stays disabled: the navigation is already on its way.
        window.location.assign(data.redirect || 'HOME_IR.PHP');
        return;
      }
      fail((data && data.error) || 'LOGIN FAILED');
    })
    .catch(function () {
      fail('COULD NOT REACH THE SERVER. PLEASE TRY AGAIN.');
    });
  });
})();
</script>
</body>
</html>
