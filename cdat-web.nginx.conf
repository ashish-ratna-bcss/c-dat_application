server {
    listen 8020;
    server_name _;

    root /mnt/storage1/cdat-web;  # Set to your deploy path (see docs/DEPLOY.md)

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'self';" always;

    client_max_body_size 750G;
    client_body_timeout 86400s;
    send_timeout 86400s;

    # Pages live in modules/ (.php); the root holds main.php only.
    location = / {
        return 302 /login;
    }

    location / {
        try_files $uri $uri/ /main.php?$query_string;
    }

    # Pages used to sit at the root. Keep old flat URLs working for bookmarks.
    location @flat {
        rewrite ^/(?:controller/)?([A-Za-z0-9_%&.-]+\.php)$ /main.php last;
        return 404;
    }

    # Case-insensitive PHP: rewrite *.PHP to *.php so FastCGI executes.
    location ~ ^(.+)\.PHP$ {
        rewrite ^(.+)\.PHP$ $1.php last;
    }

    # 218 of the .html/.htm pages contain <?php, so they must go through FastCGI
    # too. Serving them statically is what leaked raw PHP source to the browser.
    location ~ \.(?:php|html?)$ {
        include fastcgi.conf;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_read_timeout 86400s;
        fastcgi_send_timeout 86400s;
        fastcgi_connect_timeout 10s;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
        fastcgi_param PHP_VALUE "memory_limit=512M \n max_execution_time=86400";
    }

    # Server-side includes, never pages: db_config holds the live password.
    location ~ ^/modules/common/(db_config(\.example)?|activity_logger|cdr_upload_config|cdr_upload_parser|excel_converter|cdr_enrichment_sql|upload_verification_service|document_processing_client)\.(php|html?)$ {
        deny all;
    }

    location ~ /\. {
        deny all;
    }

    location ~ \.log$ {
        deny all;
    }

    # Large SDR/.bak uploads stream directly to the document processing API (bypasses PHP limits).
    location /document-api/ {
        client_max_body_size 750G;
        client_body_timeout 86400s;
        proxy_request_buffering off;
        proxy_pass http://127.0.0.1:8088/;
        proxy_http_version 1.1;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_connect_timeout 60s;
    }
}
