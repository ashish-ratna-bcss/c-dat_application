# C-DAT web vhost
#
# REQUIRED in the http {} context (nginx.conf or conf.d):
#   include /mnt/storage1/cdat-web/scripts/nginx-url-alias-map.conf;
#
# That map rewrites legacy casing/extension URLs (e.g. /home.html) to the
# canonical real file at the document root (e.g. /HOME.html).
# Archived symlink copies live in old_versionfiles/ (gitignored) and are NOT served.

server {
    listen 8020;
    server_name _;

    root /mnt/storage1/cdat-web;
    index HOME.html HOME.HTML index.html index.php;

    client_max_body_size 750G;
    client_body_timeout 86400s;
    send_timeout 86400s;

    # Legacy URL aliases → canonical real files (map defined in http context).
    if ($cdat_canonical_uri != "") {
        rewrite ^ $cdat_canonical_uri last;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    # Never serve the symlink archive as the application.
    location ^~ /old_versionfiles/ {
        deny all;
        return 404;
    }

    # Case-insensitive PHP: rewrite *.PHP to *.php so FastCGI executes
    # when the on-disk canonical uses a different extension case.
    location ~ ^(.+)\.PHP$ {
        rewrite ^(.+)\.PHP$ $1.php last;
    }

    location ~ \.php$ {
        include fastcgi.conf;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_read_timeout 86400s;
        fastcgi_send_timeout 86400s;
        fastcgi_connect_timeout 10s;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
        fastcgi_param PHP_VALUE "auto_prepend_file=/mnt/storage1/cdat-web/sqlsrv_compat.php \n memory_limit=512M \n max_execution_time=86400";
    }

    # HTML forms that are actually PHP (rare); allow case-insensitive html/htm via FPM when needed.
    # Prefer static file serve for real .html; map above handles aliases.

    location ~ /\. {
        deny all;
    }

    # Large SDR/.bak uploads stream directly to the document processing API (bypasses PHP limits).
    location /document-api/ {
        client_max_body_size 750G;
        client_body_timeout 86400s;
        proxy_request_buffering off;
        proxy_pass http://127.0.0.1:8088/;
        proxy_http_version 1.1;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_connect_timeout 60s;
    }
}
