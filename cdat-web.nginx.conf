server {
    listen 8020;
    server_name _;

    root /mnt/storage1/cdat-web;
    index HOME.html HOME.HTML index.html index.php;

    client_max_body_size 50M;
    client_body_timeout 60s;
    send_timeout 120s;

    location / {
        try_files $uri $uri/ =404;
    }

    # Case-insensitive PHP: rewrite *.PHP to *.php so FastCGI executes.
    location ~ ^(.+)\.PHP$ {
        rewrite ^(.+)\.PHP$ $1.php last;
    }

    location ~ \.php$ {
        include fastcgi.conf;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_read_timeout 180s;
        fastcgi_send_timeout 180s;
        fastcgi_connect_timeout 10s;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
        fastcgi_param PHP_VALUE "auto_prepend_file=/mnt/storage1/cdat-web/sqlsrv_compat.php \n memory_limit=256M \n max_execution_time=180";
    }

    location ~ /\. {
        deny all;
    }
}
