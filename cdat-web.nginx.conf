# C-DAT web vhost — Phase 4 document root = public/
#
# In http {}:
#   include /mnt/storage1/cdat-web/scripts/nginx-url-alias-map.conf;
#
# public/index.php delegates to existing root forwarders/files (strangle migration).
# Static assets remain in the repo root and are aliased here.

server {
    listen 8020;
    server_name _;

    set $cdat_root /mnt/storage1/cdat-web;
    root $cdat_root/public;
    index index.php;

    client_max_body_size 750G;
    client_body_timeout 86400s;
    send_timeout 86400s;

    if ($cdat_canonical_uri != "") {
        rewrite ^ $cdat_canonical_uri last;
    }

    location /IMAGES/ {
        alias $cdat_root/IMAGES/;
    }
    location /SpryAssets/ {
        alias $cdat_root/SpryAssets/;
    }
    location /js/ {
        alias $cdat_root/js/;
    }

    location ^~ /old_versionfiles/ {
        deny all;
        return 404;
    }

    # Do not expose app internals, uploads, or tooling via the web root.
    location ^~ /app/ { deny all; return 404; }
    location ^~ /bootstrap/ { deny all; return 404; }
    location ^~ /cdr_import/ { deny all; return 404; }
    location ^~ /cdr-import-service/ { deny all; return 404; }
    location ^~ /document_processing/ { deny all; return 404; }
    location ^~ /sql/ { deny all; return 404; }
    location ^~ /scripts/ { deny all; return 404; }
    location ^~ /var/ { deny all; return 404; }
    location ^~ /uploads/ { deny all; return 404; }
    location = /.env { deny all; return 404; }

    location / {
        try_files $uri /index.php$is_args$args;
    }

    location ~ ^(.+)\.PHP$ {
        rewrite ^(.+)\.PHP$ $1.php last;
    }

    location ~ \.php$ {
        include fastcgi.conf;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_read_timeout 86400s;
        fastcgi_send_timeout 86400s;
        fastcgi_connect_timeout 10s;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PHP_VALUE "auto_prepend_file=$cdat_root/sqlsrv_compat.php \n memory_limit=512M \n max_execution_time=86400";
    }

    location ~ /\. {
        deny all;
    }

    location /document-api/ {
        client_max_body_size 750G;
        client_body_timeout 86400s;
        proxy_request_buffering off;
        proxy_pass http://127.0.0.1:8088/;
        proxy_http_version 1.1;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_connect_timeout 60s;
    }
}
