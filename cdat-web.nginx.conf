server {
    listen 8020;
    server_name _;

    root /mnt/storage1/cdat-web;
    index HOME.html HOME.HTML index.html index.php;

    client_max_body_size 750G;
    client_body_timeout 86400s;
    send_timeout 86400s;

    location / {
        try_files $uri $uri/ =404;
    }

    # Case-insensitive PHP: rewrite *.PHP to *.php so FastCGI executes.
    location ~ ^(.+)\.PHP$ {
        rewrite ^(.+)\.PHP$ $1.php last;
    }

    location ~ \.php$ {
        include fastcgi.conf;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_read_timeout 86400s;
        fastcgi_send_timeout 86400s;
        fastcgi_connect_timeout 10s;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
        fastcgi_param PHP_VALUE "auto_prepend_file=/mnt/storage1/cdat-web/sqlsrv_compat.php \n memory_limit=512M \n max_execution_time=86400";
    }

    location ~ /\. {
        deny all;
    }

    # Large SDR/.bak uploads stream directly to the document processing API (bypasses PHP limits).
    location /document-api/ {
        client_max_body_size 750G;
        client_body_timeout 86400s;
        proxy_request_buffering off;
        proxy_pass http://127.0.0.1:8088/;
        proxy_http_version 1.1;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_connect_timeout 60s;
    }
}
