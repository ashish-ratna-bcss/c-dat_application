server {
    listen 8020;
    server_name _;

    root /mnt/storage1/cdat-web;

    client_max_body_size 750G;
    client_body_timeout 86400s;
    send_timeout 86400s;

    # Pages live in view/ (.html/.htm) and controller/ (.php); the root holds no
    # index file. Land on the login form rather than a directory listing.
    location = / {
        return 302 /view/auth.html;
    }

    location / {
        try_files $uri $uri/ @flat;
    }

    # Pages used to sit at the root. Keep old flat URLs working for bookmarks.
    location @flat {
        rewrite ^/([A-Za-z0-9_%&.-]+\.php)$  /controller/$1 last;
        rewrite ^/([A-Za-z0-9_%&.-]+\.html?)$ /view/$1      last;
        return 404;
    }

    # Case-insensitive PHP: rewrite *.PHP to *.php so FastCGI executes.
    location ~ ^(.+)\.PHP$ {
        rewrite ^(.+)\.PHP$ $1.php last;
    }

    # 218 of the .html/.htm pages contain <?php, so they must go through FastCGI
    # too. Serving them statically is what leaked raw PHP source to the browser.
    location ~ \.(?:php|html?)$ {
        include fastcgi.conf;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_read_timeout 86400s;
        fastcgi_send_timeout 86400s;
        fastcgi_connect_timeout 10s;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
        fastcgi_param PHP_VALUE "auto_prepend_file=/mnt/storage1/cdat-web/controller/sqlsrv_compat.php \n memory_limit=512M \n max_execution_time=86400";
    }

    # Server-side includes, never pages: db_config holds the live password and
    # sqlsrv_compat is already loaded via auto_prepend_file (requesting it
    # directly fatals on "Cannot redeclare"). Mirrors the Apache .htaccess.
    location ~ ^/controller/(db_config(\.example)?|sqlsrv_compat|activity_logger|cdr_upload_config|cdr_upload_parser|excel_converter|cdr_enrichment_sql|upload_verification_service|document_processing_client)\.(php|html?)$ {
        deny all;
    }

    location ~ /\. {
        deny all;
    }

    location ~ \.log$ {
        deny all;
    }

    # Large SDR/.bak uploads stream directly to the document processing API (bypasses PHP limits).
    location /document-api/ {
        client_max_body_size 750G;
        client_body_timeout 86400s;
        proxy_request_buffering off;
        proxy_pass http://127.0.0.1:8088/;
        proxy_http_version 1.1;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_connect_timeout 60s;
    }
}
