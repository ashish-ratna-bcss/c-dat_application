# CDAT web (PHP) + reverse proxy to dataUpload API on 127.0.0.1:8090
# Set `root` to the application directory. PHP-FPM socket path may differ.
# Production .env: DATA_UPLOAD_URL=/
# so the browser calls /api/v1/... on this host (this proxy), not :8090.

server {
    listen 8020;
    server_name _;

    root /mnt/storage1/cdat-web;
    index main.php;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://fonts.googleapis.com; img-src 'self' data:; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self'; frame-ancestors 'self';" always;

    client_max_body_size 750G;
    client_body_timeout 86400s;
    send_timeout 86400s;

    location = / {
        return 302 /login;
    }

    location = /upload-health {
        proxy_pass http://127.0.0.1:8090/health;
        proxy_connect_timeout 5s;
        proxy_read_timeout 10s;
    }

    location /api/v1/ {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_send_timeout 86400s;
        proxy_read_timeout 86400s;
        client_max_body_size 750G;
        client_body_timeout 86400s;
    }

    location ^~ /public/assets/ {
        access_log off;
        expires 7d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location ~ /\. {
        deny all;
    }

    location ~ /\.env {
        deny all;
    }

    location ~ ^/(dataUpload|sql|scripts|docs|deploy|var|uploads|old_removed_codeShivang)(/|$) {
        deny all;
    }

    location ~ ^/config/ {
        deny all;
    }

    location ~ ^/modules/common/(db_config(\.example)?|activity_logger|bootstrap|csrf)\.(php|html?)$ {
        deny all;
    }

    location ~ \.log$ {
        deny all;
    }

    location ~ ^(.+)\.PHP$ {
        rewrite ^(.+)\.PHP$ $1.php last;
    }

    location ~ \.(?:php|html?)$ {
        include fastcgi.conf;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_read_timeout 86400s;
        fastcgi_send_timeout 86400s;
        fastcgi_connect_timeout 10s;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
        fastcgi_param PHP_VALUE "auto_prepend_file= \n memory_limit=512M \n max_execution_time=86400";
    }

    location / {
        try_files $uri $uri/ /main.php?$query_string;
    }
}
