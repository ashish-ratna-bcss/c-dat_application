; CDAT web pool tuning — install with scripts/install-cdat-stability.sh
; Conservative on a 62GB host shared with MSSQL (~24GB), MongoDB, Ollama.

[www]
pm = dynamic
pm.max_children = 8
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 4
pm.max_requests = 200
request_terminate_timeout = 180
request_slowlog_timeout = 30s
slowlog = /var/log/php8.3-fpm-cdat-slow.log
