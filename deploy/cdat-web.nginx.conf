# C-DAT production Nginx site template
# TLS termination + security headers. Place under /etc/nginx/sites-available/
# and adjust server_name, certificate paths, and upstream ports.
#
# CRITICAL:
# - Do NOT proxy PostgreSQL (5432) or FastAPI (5022/8090) to the public internet.
# - Only this HTTPS entry point should be reachable from investigators' network.

upstream cdat_php {
    server 127.0.0.1:8022;
    keepalive 8;
}

server {
    listen 80;
    listen [::]:80;
    server_name cdat.example.police;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name cdat.example.police;

    # ssl_certificate     /etc/ssl/cdat/fullchain.pem;
    # ssl_certificate_key /etc/ssl/cdat/privkey.pem;
    # ssl_protocols       TLSv1.2 TLSv1.3;
    # ssl_prefer_server_ciphers off;

    client_max_body_size 700g;
    client_body_timeout 3600s;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    # Block sensitive trees even if misrouted
    location ~* ^/(config|logs|dataUpload|\.env|sql|scripts|deploy) {
        deny all;
        return 403;
    }
    location ~* \.(env|log|sql|bak|git)$ {
        deny all;
        return 403;
    }

    location / {
        proxy_pass http://cdat_php;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
    }
}
